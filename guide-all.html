<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>作画指南 · 戴上春天</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  /* 作画指南 · 单页滚动版：黑体 + 收紧行距 + 项目介绍同款悬停效果 */
  body{
    font-family:"SimHei","黑体","Heiti SC","STHeiti","Microsoft YaHei",Arial,sans-serif;
    line-height:1.5;
  }
  .ga-nav{
    position:sticky;top:0;z-index:50;height:58px;
    background:rgba(255,255,255,.72);
    backdrop-filter:blur(10px);-webkit-backdrop-filter:blur(10px);
    border-bottom:1px solid var(--line);
  }
  .ga-nav .container{display:flex;align-items:center;gap:10px;height:100%}
  .ga-brand{font-size:15px;font-weight:700;letter-spacing:.04em;color:var(--ink)}
  .ga-brand small{margin-left:8px;font-size:12px;font-weight:400;color:var(--ink-soft);letter-spacing:.12em}
  .ga-nav .spacer{flex:1}
  .ga-wrap{max-width:960px;margin:0 auto;padding:0 24px 72px}
  .ga-hero{padding:54px 0 10px;text-align:center}
  .ga-kicker{
    font-size:12px;font-weight:700;letter-spacing:.32em;color:var(--primary-deep);
    text-transform:uppercase;
  }
  .ga-hero h1{
    font-size:clamp(27px,3.5vw,40px);line-height:1.32;font-weight:700;
    margin:12px auto 12px;max-width:760px;
  }
  .ga-hero .ga-lead{font-size:16px;color:var(--ink-soft);max-width:640px;margin:0 auto}
  .ga-hero .ga-meta{font-size:12px;color:var(--ink-soft);letter-spacing:.06em;margin-top:12px}
  .ga-cta-row{display:flex;gap:12px;justify-content:center;flex-wrap:wrap;margin-top:24px}

  .ga-step{margin:22px 0}
  .ga-step-head{display:flex;align-items:baseline;gap:14px;margin-bottom:14px}
  .ga-num{
    font-size:.87em;font-weight:700;letter-spacing:.14em;color:var(--primary-deep);
    flex-shrink:0;
  }
  .ga-step-head h2{font-size:1.47em;line-height:1.35;font-weight:700;margin:0}
  .ga-body{display:grid;grid-template-columns:1.06fr .94fr;gap:26px;align-items:start}
  .ga-body.no-media{grid-template-columns:1fr}
  .ga-media{margin:0}
  .ga-media img{
    display:block;width:100%;border-radius:14px;background:#fff;
    border:1px solid var(--line);box-shadow:0 8px 22px rgba(91,66,50,.12);
  }
  .ga-media img.ga-sub{max-width:86%;margin-top:12px}
  .ga-text p{font-size:1.07em;line-height:1.5;margin:0 0 10px}
  .ga-text p:last-child{margin-bottom:0}
  .ga-trio{display:grid;grid-template-columns:repeat(3,1fr);gap:14px;margin-top:18px}
  .ga-trio figure{margin:0}
  .ga-trio img{
    display:block;width:100%;border-radius:12px;background:#fff;
    border:1px solid var(--line);box-shadow:0 6px 16px rgba(91,66,50,.10);
  }
  .ga-trio figcaption{text-align:center;font-size:13px;color:var(--ink-soft);margin-top:7px}
  .ga-end{text-align:center;margin-top:30px}
  .ga-end h2{font-size:22px;margin-bottom:8px}
  .ga-end .ga-lead{font-size:15px;color:var(--ink-soft)}
  .ga-foot{text-align:center;font-size:12px;color:var(--ink-soft);margin-top:30px}

  @media (max-width:820px){
    .ga-body{grid-template-columns:1fr;gap:18px}
    .ga-step-head h2{font-size:1.27em}
    .ga-text p{font-size:1em}
    .ga-trio{grid-template-columns:1fr;gap:12px}
    .ga-trio figure{display:flex;align-items:center;gap:12px}
    .ga-trio img{width:64%}
    .ga-trio figcaption{margin-top:0;text-align:left}
    .ga-wrap{padding:0 18px 56px}
  }
</style>

function detectLang(){
  const list = (navigator.languages && navigator.languages.length
    ? navigator.languages : [navigator.language || '']).map(v => String(v).toLowerCase());
  for(const l of list){
    if(l.indexOf('zh') === 0) return 'zh';
    if(l.indexOf('fr') === 0) return 'fr';
    if(l.indexOf('en') === 0) return 'en';
  }
  let saved = null;
  try{ saved = JSON.parse(localStorage.getItem('wa_lang') || 'null'); }catch(e){}
  return (saved === 'zh' || saved === 'en' || saved === 'fr') ? saved : 'zh';
}

function render(lang){
  const d = GUIDE[lang] || GUIDE.zh;
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.title = d.docTitle;

  document.getElementById('gaBrand').innerHTML =
    d.brand + '<small>' + d.brandSub + '</small>';
  document.getElementById('gaBack').textContent = d.back;
  document.getElementById('gaKicker').textContent = d.kicker;
  document.getElementById('gaTitle').textContent = d.title;
  document.getElementById('gaLead').textContent = d.lead;
  document.getElementById('gaMeta').textContent = d.meta;
  document.getElementById('gaStart').textContent = d.start;
  document.getElementById('gaStart2').textContent = d.start;
  document.getElementById('gaStepBtn').textContent = d.stepBtn;
  document.getElementById('gaStepBtn2').textContent = d.stepBtn;
  document.getElementById('gaEndTitle').textContent = d.endTitle;
  document.getElementById('gaEndText').textContent = d.endText;
  document.getElementById('gaFoot').textContent = d.foot;

  document.getElementById('gaSteps').innerHTML = d.steps.map(function(s){
    const media = s.media ? '<figure class="ga-media">' + s.media.map(function(m){
      return '<img' + (m.sub ? ' class="ga-sub"' : '') + ' src="' + m.src + '" alt="' + m.alt + '">';
    }).join('') + '</figure>' : '';
    const text = '<div class="ga-text">' + s.text.map(function(t){
      return '<p>' + t + '</p>';
    }).join('') + '</div>';
    const trio = s.trio ? '<div class="ga-trio">' + s.trio.map(function(t){
      return '<figure><img src="' + t.src + '" alt="' + t.label + '"><figcaption>' + t.label + '</figcaption></figure>';
    }).join('') + '</div>' : '';
    return '<section class="intro-section ga-step">' +
      '<div class="ga-step-head"><span class="ga-num">' + s.n + '</span><h2>' + s.title + '</h2></div>' +
      '<div class="ga-body' + (s.media ? '' : ' no-media') + '">' + media + text + '</div>' +
      trio + '</section>';
  }).join('');
}

function backOut(){
  if(window.history.length > 1) window.history.back();
  else location.href = 'index.html';
}

let currentLang = detectLang();
render(currentLang);
window.addEventListener('languagechange', function(){
  currentLang = detectLang();
  render(currentLang);
});
</script>

</html>
