<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
  <title>贪吃蛇</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <div class="game-container">
    <header class="game-header">
      <h1 class="game-title">贪吃蛇</h1>
      <div class="score-board">
        <div class="score-item">
          <span class="score-label">得分</span>
          <span class="score-value" id="score">0</span>
        </div>
        <div class="score-item">
          <span class="score-label">最高分</span>
          <span class="score-value" id="highScore">0</span>
        </div>
      </div>
    </header>

    <div class="canvas-wrapper">
      <canvas id="gameCanvas" width="400" height="400"></canvas>
      <!-- 游戏状态遮罩层 -->
      <div class="overlay" id="overlay">
        <div class="overlay-content">
          <h2 id="overlayTitle">准备开始</h2>
          <p id="overlayText">按 空格 或点击「开始」按钮</p>
        </div>
      </div>
    </div>

    <div class="controls">
      <button class="btn" id="startBtn">开始</button>
      <button class="btn" id="pauseBtn" disabled>暂停</button>
      <button class="btn" id="restartBtn">重新开始</button>
    </div>

    <!-- 移动端方向键 -->
    <div class="dpad" id="dpad">
      <button class="dpad-btn up" data-dir="up" aria-label="上">▲</button>
      <button class="dpad-btn left" data-dir="left" aria-label="左">◀</button>
      <button class="dpad-btn right" data-dir="right" aria-label="右">▶</button>
      <button class="dpad-btn down" data-dir="down" aria-label="下">▼</button>
    </div>

    <footer class="game-footer">
      <p>方向键 / WASD 控制移动 · 空格 暂停</p>
    </footer>
  </div>

  <script src="game.js"></script>
</body>
