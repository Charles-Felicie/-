<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>病房美学计划 · AI 试妆（公益版）</title>
<script src="https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/face_mesh.js"></script>
<style>
  :root{
    --bg:#FDF6EE; --bg-soft:#FAEDE0; --card:#FFFFFF;
    --ink:#5B4232; --ink-soft:#8A6F5C;
    --primary:#E76F51; --primary-deep:#C9553A;
    --secondary:#F4A261; --accent:#E9C46A;
    --line:#F0DFCE;
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  button{border-radius:12px;}
  .modal-box, .plist-item, .emotion-row .emotion-btn{border-radius:12px;}
  html,body{height:100%;}
  body{
    font-family:"PingFang SC","Microsoft YaHei",sans-serif;
    background:var(--bg); color:var(--ink); overflow:hidden;
  }
  .page{display:none; width:100vw; height:100vh;}
  .page.active{display:flex;}

  /* ========== 首页 ========== */
  #page-home{flex-direction:row;}
  .home-left{
    flex:1; display:flex; flex-direction:column; justify-content:center; align-items:center;
    background:var(--bg); gap:36px;
  }
  .home-left h1{font-size:52px; font-weight:600; letter-spacing:10px; color:var(--ink);}
  .home-right{
    flex:1; background:var(--bg); display:flex; justify-content:center; align-items:center;
  }
  .demo-img{
    width:72%; height:78%; object-fit:cover; display:block;
    border:none; border-radius:20px;
  }
  .btn-primary{
    padding:16px 64px; font-size:20px; letter-spacing:6px; cursor:pointer;
    background:var(--primary); color:#fff; border:none; transition:background .2s;
  }
  .btn-primary:hover{background:var(--primary-deep);}

  /* ========== 模式选择弹窗 ========== */
  .modal-mask{
    position:fixed; inset:0; z-index:50; background:rgba(0,0,0,.45);
    display:none; justify-content:center; align-items:center;
  }
  .modal-box{
    background:var(--card); border:1px solid var(--line); padding:48px 56px;
    display:flex; flex-direction:column; gap:18px; align-items:center;
  }
  .modal-box button{
    width:280px; padding:15px 0; font-size:18px; letter-spacing:4px; cursor:pointer; border:none;
  }
  .modal-box .btn-mode-a{background:var(--secondary); color:var(--ink);}
  .modal-box .btn-mode-a:hover{background:var(--accent);}
  .modal-box .btn-mode-b{background:var(--primary); color:#fff;}
  .modal-box .btn-mode-b:hover{background:var(--primary-deep);}

  /* ========== 情绪选择界面 ========== */
  #page-emotion{
    flex-direction:column; justify-content:center; align-items:center; gap:48px;
    background:var(--bg);
  }
  .emotion-title{font-size:28px; letter-spacing:6px; color:var(--ink); font-weight:600;}
  .emotion-row{display:flex; gap:14px; flex-wrap:wrap; justify-content:center; padding:0 24px;}
  .emotion-btn{
    min-width:110px; padding:16px 0; font-size:18px; letter-spacing:4px; cursor:pointer;
    background:var(--card); color:var(--ink); border:1px solid var(--line); transition:all .15s;
  }
  .emotion-btn:hover{border-color:var(--secondary);}
  .emotion-btn.selected{background:var(--primary); color:#fff; border-color:var(--primary-deep);}
  #btn-emotion-start{
    width:min(560px, 80vw); padding:17px 0; font-size:20px; letter-spacing:8px;
    background:var(--primary); color:#fff; border:none; cursor:pointer;
  }
  #btn-emotion-start:hover{background:var(--primary-deep);}

  /* ========== 试妆界面 ========== */
  #page-tryon{position:relative; background:#000; flex-direction:column;}
  #cam-canvas{position:absolute; inset:0; width:100%; height:100%; object-fit:cover;}
  .top-icons{position:absolute; top:16px; right:16px; display:flex; gap:12px; z-index:30;}
  .icon-btn{
    width:40px; height:40px; background:rgba(255,255,255,.88); border:1px solid var(--line);
    cursor:pointer; display:flex; justify-content:center; align-items:center; transition:background .2s;
  }
  .icon-btn:hover{background:#fff;}
  .icon-btn svg{width:20px; height:20px; stroke:var(--ink); fill:none; stroke-width:2; stroke-linecap:square;}

  #loading-mask{
    position:absolute; inset:0; z-index:40; background:rgba(0,0,0,.55);
    display:none; justify-content:center; align-items:center; color:#fff; font-size:18px; letter-spacing:2px;
  }

  /* 情绪匹配提示小字 */
  #emotion-caption{
    position:absolute; left:0; right:0; bottom:76px; z-index:29;
    text-align:center; font-size:15px; letter-spacing:3px; color:#fff;
    text-shadow:0 1px 6px rgba(0,0,0,.6); display:none;
  }

  /* 底部操作栏 */
  #bottom-bar{
    position:absolute; left:0; right:0; bottom:0; z-index:30;
    background:rgba(255,255,255,.94); border-top:1px solid var(--line); padding:10px 0;
  }
  .bar-scroll{display:flex; align-items:center; gap:10px; overflow-x:auto; padding:0 14px; scrollbar-width:thin;}
  .bar-scroll::-webkit-scrollbar{height:4px;}
  .bar-scroll::-webkit-scrollbar-thumb{background:var(--line);}
  .cat-btn{
    flex:0 0 auto; min-width:76px; height:52px; padding:0 18px;
    background:var(--bg-soft); border:1px solid var(--line); color:var(--ink);
    font-size:16px; cursor:pointer; position:relative;
  }
  .cat-btn:hover{background:var(--accent);}
  .cat-btn.has-active::after{
    content:""; position:absolute; top:6px; right:6px; width:8px; height:8px; background:var(--primary);
  }
  .back-btn{
    flex:0 0 auto; height:52px; padding:0 16px;
    background:var(--card); border:1px solid var(--ink-soft); color:var(--ink); font-size:15px; cursor:pointer;
  }
  .back-btn:hover{background:var(--bg-soft);}
  .shade-btn{flex:0 0 auto; width:44px; height:44px; border:2px solid var(--line); cursor:pointer;}
  .shade-btn:hover{transform:scale(1.12);}
  .shade-btn.selected{border-color:var(--primary); box-shadow:0 0 0 2px var(--primary);}

  #toast{
    position:absolute; top:45%; left:50%; transform:translate(-50%,-50%);
    background:rgba(91,66,50,.92); color:#fff; padding:16px 42px; font-size:20px;
    letter-spacing:4px; z-index:60; display:none;
  }
  #tooltip{
    position:fixed; z-index:70; background:var(--ink); color:#fff;
    padding:6px 12px; font-size:13px; pointer-events:none; display:none; max-width:320px;
  }

  @media (max-width:720px){
    #page-home{flex-direction:column;}
    .home-right{}
    .home-left h1{font-size:34px;}
  }
</style>
</head>

/* ================= 全局状态 ================= */
const video  = document.getElementById('cam-video');
const canvas = document.getElementById('cam-canvas');
const ctx    = canvas.getContext('2d');

let faceMesh = null, latestLandmarks = null, cameraOn = false, rafId = null;
const active = {lipstick:null, eyeshadow:null, eyeliner:null, eyebrow:null, blush:null, foundation:null, hair:null};

let barState = 'categories'; // categories | shades
let currentCat = null;

/* ================= 页面切换 ================= */
function showPage(id){
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

/* ================= 底部操作栏 ================= */
const barScroll = document.getElementById('bar-scroll');
const tooltip = document.getElementById('tooltip');
let tooltipTimer = null;

function hideTooltip(){ tooltip.style.display='none'; clearTimeout(tooltipTimer); }

function bindTooltip(el, text){
  el.addEventListener('mouseenter', e => {
    clearTimeout(tooltipTimer);
    tooltipTimer = setTimeout(() => {
      tooltip.textContent = text;
      tooltip.style.display = 'block';
      tooltip.style.left = Math.min(e.clientX + 14, window.innerWidth - 330) + 'px';
      tooltip.style.top  = (e.clientY - 44) + 'px';
    }, 600);
  });
  el.addEventListener('mousemove', e => {
    if(tooltip.style.display === 'block'){
      tooltip.style.left = Math.min(e.clientX + 14, window.innerWidth - 330) + 'px';
      tooltip.style.top  = (e.clientY - 44) + 'px';
    }
  });
  el.addEventListener('mouseleave', hideTooltip);
  el.addEventListener('click', hideTooltip);
}

function renderCategories(){
  barState = 'categories';
  barScroll.innerHTML = '';
  DATA.forEach(cat => {
    const b = document.createElement('button');
    b.className = 'cat-btn' + (active[cat.key] ? ' has-active' : '');
    b.textContent = cat.label;
    b.onclick = () => renderAllShades(cat);
    barScroll.appendChild(b);
  });
}

function makeBackBtn(onClick){
  const b = document.createElement('button');
  b.className = 'back-btn';
  b.textContent = '← 返回';
  b.onclick = onClick;
  return b;

/* 公益版：品类 -> 直接展示该品类所有款式的所有色号 */
function renderAllShades(cat){
  barState = 'shades'; currentCat = cat;
  barScroll.innerHTML = '';
  barScroll.appendChild(makeBackBtn(renderCategories));
  cat.products.forEach(p => {
    p.shades.forEach(s => {
      const b = document.createElement('button');
      b.className = 'shade-btn' + (active[cat.key] && active[cat.key].hex === s.hex && active[cat.key]._pid === p.name ? ' selected' : '');
      b.style.background = s.hex;
      b.onclick = () => toggleShade(cat, p, s);
      bindTooltip(b, p.name + ' · ' + s.name);
      barScroll.appendChild(b);
    });
  });
}

function toggleShade(cat, product, shade){
  const cur = active[cat.key];
  if(cur && cur.hex === shade.hex && cur._pid === product.name){
    active[cat.key] = null; // 再次点击，效果消失
  }else{
    active[cat.key] = Object.assign({_pid:product.name}, shade);
  }
  if(barState === 'shades') renderAllShades(cat);
  else if(barState === 'categories') renderCategories();
}

/* ================= AI 试妆引擎（MediaPipe FaceMesh） ================= */
const LIPS_OUTER = [61,185,40,39,37,0,267,269,270,409,291,375,321,405,314,17,84,181,91,146];
const LIPS_INNER = [78,95,88,178,87,14,317,402,318,324,308,415,310,311,312,13,82,81,80,191];
const BROW_L = [70,63,105,66,107,55,65,52,53,46];
const BROW_R = [300,293,334,296,336,285,295,282,283,276];
const BROW_L_LOW = [46,53,52,65,55];
const BROW_R_LOW = [276,283,282,295,285];
const LID_L = [33,246,161,160,159,158,157,173,133];
const LID_R = [263,466,388,387,386,385,384,398,362];
const FACE_OVAL = [10,338,297,332,284,251,389,356,454,323,361,288,397,365,379,378,400,377,152,148,176,149,150,136,172,58,132,93,234,127,162,21,54,103,67,109];
const HEAD_ARC = [284,332,297,338,10,109,67,103,54];

function lm(lms, i, W, H){ return {x:(1-lms[i].x)*W, y:lms[i].y*H}; }

function pathFrom(lms, idx, W, H, close=true){
  ctx.beginPath();
  idx.forEach((p,i) => {
    const pt = lm(lms, p, W, H);
    i ? ctx.lineTo(pt.x, pt.y) : ctx.moveTo(pt.x, pt.y);
  });
  if(close) ctx.closePath();
}

function hexA(hex, a){
  const r=parseInt(hex.slice(1,3),16), g=parseInt(hex.slice(3,5),16), b=parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

/* ============ 妆容浓度：数值越小越淡越自然（0.3 极淡 / 1 浓郁） ============ */
const INTENSITY = 0.62;
const SOFT_EDGE = (ctx.filter !== undefined) && (ctx.filter !== null);
function soft(px){
  if(SOFT_EDGE) ctx.filter = 'blur(' + px + 'px)';
}

function drawMakeup(lms){
  const W = canvas.width, H = canvas.height;
  const faceW = Math.abs(lms[454].x - lms[234].x) * W;

  if(active.foundation){
    ctx.save();
    soft(5);
    pathFrom(lms, FACE_OVAL, W, H);
    ctx.globalCompositeOperation = 'soft-light';
    ctx.fillStyle = hexA(active.foundation.hex, 0.20);
    ctx.fill();
    ctx.restore();
  }
  if(active.hair){
    const c = lm(lms, 6, W, H);
    ctx.save();
    soft(3);
    ctx.beginPath();
    HEAD_ARC.forEach((p,i) => {
      const pt = lm(lms, p, W, H);
      const ex = c.x + (pt.x - c.x) * 1.85, ey = c.y + (pt.y - c.y) * 1.85;
      i ? ctx.lineTo(ex, ey) : ctx.moveTo(ex, ey);
    });
    [...HEAD_ARC].reverse().forEach(p => {
      const pt = lm(lms, p, W, H); ctx.lineTo(pt.x, pt.y);
    });
    ctx.closePath();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = hexA(active.hair.hex, 0.22);
    ctx.fill();
    ctx.restore();
  }
  if(active.blush){
    [[123],[352]].forEach(([i]) => {
      const pt = lm(lms, i, W, H);
      const r = faceW * 0.17;
      const g = ctx.createRadialGradient(pt.x,pt.y,0, pt.x,pt.y,r);
      g.addColorStop(0, hexA(active.blush.hex, 0.17));
      g.addColorStop(0.5, hexA(active.blush.hex, 0.09));
      g.addColorStop(1, hexA(active.blush.hex, 0));
      ctx.save();
      ctx.fillStyle = g;
      ctx.beginPath(); ctx.arc(pt.x, pt.y, r, 0, Math.PI*2); ctx.fill();
      ctx.restore();
    });
  }
  if(active.eyeshadow){
    [[LID_L, BROW_L_LOW],[LID_R, BROW_R_LOW]].forEach(([lid, brow]) => {
      ctx.save();
      soft(5);
      ctx.beginPath();
      lid.forEach((p,i) => { const pt=lm(lms,p,W,H); i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y); });
      brow.forEach(p => { const pt=lm(lms,p,W,H); ctx.lineTo(pt.x,pt.y); });
      ctx.closePath();
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = hexA(active.eyeshadow.hex, 0.17);
      ctx.fill();
      ctx.restore();
    });
  }
  if(active.eyeliner){
    [LID_L, LID_R].forEach(lid => {
      ctx.save();
      soft(1.2);
      pathFrom(lms, lid, W, H, false);
      ctx.strokeStyle = hexA(active.eyeliner.hex, 0.42);
      ctx.lineWidth = Math.max(1.2, faceW * 0.007);
      ctx.lineJoin = 'round'; ctx.lineCap = 'round';
      ctx.stroke();
      ctx.restore();
    });
  }
  if(active.eyebrow){
    [BROW_L, BROW_R].forEach(brow => {
      ctx.save();
      soft(2.5);
      pathFrom(lms, brow, W, H);
      ctx.globalCompositeOperation = 'multiply';
      ctx.fillStyle = hexA(active.eyebrow.hex, 0.26);
      ctx.fill();
      ctx.restore();
    });
  }
  if(active.lipstick){
    ctx.save();
    soft(1.2);
    ctx.beginPath();
    LIPS_OUTER.forEach((p,i) => { const pt=lm(lms,p,W,H); i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y); });
    ctx.closePath();
    LIPS_INNER.forEach((p,i) => { const pt=lm(lms,p,W,H); i?ctx.lineTo(pt.x,pt.y):ctx.moveTo(pt.x,pt.y); });
    ctx.closePath();
    ctx.globalCompositeOperation = 'multiply';
    ctx.fillStyle = hexA(active.lipstick.hex, 0.32);
    ctx.fill('evenodd');
    ctx.globalCompositeOperation = 'source-over';
    ctx.fillStyle = hexA(active.lipstick.hex, 0.07);
    ctx.fill('evenodd');
    ctx.restore();
  }
}

function renderFrame(){
  if(!cameraOn) return;
  const W = canvas.width, H = canvas.height;
  ctx.save();
  ctx.translate(W, 0); ctx.scale(-1, 1);
  ctx.drawImage(video, 0, 0, W, H);
  ctx.restore();
  if(latestLandmarks) drawMakeup(latestLandmarks);
  rafId = requestAnimationFrame(renderFrame);
}

async function startCamera(){
  document.getElementById('loading-mask').style.display = 'flex';
  try{
    const stream = await navigator.mediaDevices.getUserMedia({
      video:{facingMode:'user', width:{ideal:640}, height:{ideal:480}}, audio:false
    });
    video.srcObject = stream;
    await video.play();
  }catch(e){
    document.getElementById('loading-mask').textContent = '无法访问摄像头，请检查浏览器权限设置';
    return;
  }
  cameraOn = true;
  renderFrame();

  if(typeof FaceMesh !== 'undefined'){
    faceMesh = new FaceMesh({locateFile: f => `https://cdn.jsdelivr.net/npm/@mediapipe/face_mesh@0.4.1633559619/${f}`});
    faceMesh.setOptions({maxNumFaces:1, refineLandmarks:false, minDetectionConfidence:0.5, minTrackingConfidence:0.5});
    faceMesh.onResults(res => {
      latestLandmarks = (res.multiFaceLandmarks && res.multiFaceLandmarks[0]) || null;
      document.getElementById('loading-mask').style.display = 'none';
    });
    (async function detect(){
      while(cameraOn){
        if(video.readyState >= 2){
          try{ await faceMesh.send({image: video}); }catch(e){}
        }
        await new Promise(r => setTimeout(r, 30));
      }
    })();
  }else{
    document.getElementById('loading-mask').textContent = 'AI 模型加载失败，请检查网络后刷新重试';
    setTimeout(() => document.getElementById('loading-mask').style.display='none', 2500);
  }
}

function stopCamera(){
  cameraOn = false;
  if(rafId) cancelAnimationFrame(rafId);
  if(video.srcObject){ video.srcObject.getTracks().forEach(t => t.stop()); video.srcObject = null; }
  latestLandmarks = null;
}

function resetMakeup(){
  Object.keys(active).forEach(k => active[k] = null);
  document.getElementById('emotion-caption').style.display = 'none';
}

function showToast(el){
  el.style.display = 'block';
  setTimeout(() => el.style.display = 'none', 2500);
}

  renderCategories();

// 情绪 -> 智能匹配妆容
function applyEmotionLook(key){
  resetMakeup();
  const emo = EMOTIONS[key];
  emo.items.forEach(item => {
    active[item.cat] = {hex:item.hex, name:item.shade, _pid:item.product};
  });
  const cap = document.getElementById('emotion-caption');
  cap.textContent = emo.caption;
  cap.style.display = 'block';
}
