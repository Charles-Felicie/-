<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>☁️ 夏尔3D 捏捏乐 - 美白版</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <style>
        body { margin: 0; overflow: hidden; background: #fff8f0; font-family: 'Segoe UI','PingFang SC',sans-serif; }
        #canvas-container { width: 100vw; height: 100vh; }
        .ui-layer { position: absolute; top: 0; left: 0; width: 100%; pointer-events: none; }
        @keyframes pop {
            0% { transform: scale(1); }
            40% { transform: scale(1.3); }
            100% { transform: scale(0); opacity: 0; }
        }
        .pop-text {
            position: absolute; color: #8b6914; font-weight: 700; font-size: 20px;
            pointer-events: none; animation: pop 0.8s ease-out forwards;
            text-shadow: 0 2px 4px rgba(255,255,255,0.8);
        }
        .loading-overlay {
            position: fixed; inset: 0; background: #fff8f0;
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            z-index: 9999; transition: opacity 0.5s;
        }
        .loading-overlay.hidden { opacity: 0; pointer-events: none; }
        .spinner {
            width: 50px; height: 50px; border: 4px solid #e8d5c0;
            border-top-color: #8b6914; border-radius: 50%;
            animation: spin 1s linear infinite;
        }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
    <script type="importmap">
    {
        "imports": {
            "three": "https://unpkg.com/three@0.160.0/build/three.module.js",
            "three/addons/": "https://unpkg.com/three@0.160.0/examples/jsm/"
        }
    }
    </script>
<base target="_blank">
</head>
<body>
    <div class="loading-overlay" id="loader">
        <div class="spinner"></div>
        <p class="mt-4 text-[#8b6914] font-bold text-lg">夏尔正在洗澡...</p>
    </div>

    <div id="canvas-container"></div>

    <div class="ui-layer flex flex-col items-center pt-6">
        <h1 class="text-3xl font-bold text-[#8b6914] drop-shadow-sm">☁️ 夏尔 3D 捏捏乐</h1>
        <p class="text-sm text-[#b8956a] mt-1">拖拽旋转 · 点击捏捏 · 滚轮缩放</p>
        <div class="flex gap-6 mt-4 bg-white/70 backdrop-blur-md rounded-2xl px-6 py-3 shadow-lg">
            <div class="text-center">
                <div class="text-2xl font-bold text-[#8b6914]" id="count">0</div>
                <div class="text-xs text-[#b8956a]">捏捏次数</div>
            </div>
            <div class="text-center">
                <div class="text-2xl font-bold text-[#8b6914]" id="combo">0</div>
                <div class="text-xs text-[#b8956a]">连击</div>
            </div>
        </div>
        <div class="mt-3 text-[#b8956a] font-medium min-h-[24px]" id="mood">夏尔洗白白啦~</div>
    </div>

    <div class="absolute bottom-6 left-1/2 -translate-x-1/2 flex gap-3 pointer-events-auto">
        <button onclick="window.resetCamera()" class="px-4 py-2 bg-white/80 rounded-full text-[#8b6914] font-bold shadow hover:scale-105 transition">重置视角</button>
        <button onclick="window.toggleAutoRotate()" class="px-4 py-2 bg-white/80 rounded-full text-[#8b6914] font-bold shadow hover:scale-105 transition">自动旋转</button>
    </div>

    <script type="module">
        import * as THREE from 'three';
        import { OrbitControls } from 'three/addons/controls/OrbitControls.js';
        import { GLTFLoader } from 'three/addons/loaders/GLTFLoader.js';

        const container = document.getElementById('canvas-container');
        const scene = new THREE.Scene();
        scene.background = new THREE.Color(0xfff8f0);

        const camera = new THREE.PerspectiveCamera(45, window.innerWidth/window.innerHeight, 0.1, 100);
        camera.position.set(0, 2.5, 6);

        const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
        renderer.setSize(window.innerWidth, window.innerHeight);
        renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
        renderer.shadowMap.enabled = true;
        renderer.shadowMap.type = THREE.SoftShadowMap;
        // 让颜色更亮更暖
        renderer.outputColorSpace = THREE.SRGBColorSpace;
        renderer.toneMapping = THREE.ACESFilmicToneMapping;
        renderer.toneMappingExposure = 1.3;
        container.appendChild(renderer.domElement);

        // ===== 灯光大升级（美白关键！） =====
        // 1. 超亮环境光
        const ambientLight = new THREE.AmbientLight(0xfff0e0, 1.2);
        scene.add(ambientLight);

        // 2. 主光源（暖白色，像午后阳光）
        const dirLight = new THREE.DirectionalLight(0xfff5e6, 2.0);
        dirLight.position.set(3, 8, 5);
        dirLight.castShadow = true;
        dirLight.shadow.mapSize.width = 2048;
        dirLight.shadow.mapSize.height = 2048;
        dirLight.shadow.bias = -0.0001;
        scene.add(dirLight);

        // 3. 补光（让阴影不那么黑）
        const fillLight = new THREE.DirectionalLight(0xffecd2, 1.0);
        fillLight.position.set(-5, 3, -3);
        scene.add(fillLight);

        // 4. 半球光（模拟天空+地面反射，让整体更柔和）
        const hemiLight = new THREE.HemisphereLight(0xffffff, 0xffe8d0, 0.8);
        scene.add(hemiLight);

        // 5. 背光（轮廓光，让小马从背景中跳出来）
        const rimLight = new THREE.DirectionalLight(0xffffff, 0.6);
        rimLight.position.set(0, 2, -5);
        scene.add(rimLight);

        // ===== 地面（淡淡的阴影） =====
        const planeGeometry = new THREE.PlaneGeometry(100, 100);
        const planeMaterial = new THREE.ShadowMaterial({ opacity: 0.08 });
        const plane = new THREE.Mesh(planeGeometry, planeMaterial);
        plane.rotation.x = -Math.PI / 2;
        plane.position.y = -1.2;
        plane.receiveShadow = true;
        scene.add(plane);

        // ===== 加载夏尔 =====
        const ponyGroup = new THREE.Group();
        scene.add(ponyGroup);

        const loader = new GLTFLoader();
        loader.load('./softnami.glb', (gltf) => {
            const model = gltf.scene;

            // 自动调整大小
            const box = new THREE.Box3().setFromObject(model);
            const size = box.getSize(new THREE.Vector3());
            const maxDim = Math.max(size.x, size.y, size.z);
            const scale = 2.5 / maxDim;
            model.scale.set(scale, scale, scale);

            const center = box.getCenter(new THREE.Vector3());
            model.position.x = -center.x * scale;
            model.position.y = -center.y * scale + 0.3; // 稍微抬高
            model.position.z = -center.z * scale;

            // 美白材质！遍历所有 mesh，调亮颜色
            model.traverse((child) => {
                if (child.isMesh) {
                    child.castShadow = true;
                    child.receiveShadow = true;

                    // 如果材质有颜色，把它洗白一点
                    if (child.material) {
                        // 复制材质避免影响原文件
                        child.material = child.material.clone();

                        // 提升亮度（把颜色往白色方向拉）
                        const color = child.material.color;
                        color.r = Math.min(1, color.r * 1.15 + 0.08);
                        color.g = Math.min(1, color.g * 1.15 + 0.08);
                        color.b = Math.min(1, color.b * 1.15 + 0.08);

                        // 让材质更像毛绒（提高粗糙度，降低金属感）
                        child.material.roughness = 0.85;
                        child.material.metalness = 0.0;
                    }
                }
            });

            ponyGroup.add(model);
            document.getElementById('loader').classList.add('hidden');

        }, undefined, (error) => {
            console.error('加载失败:', error);
            document.querySelector('#loader p').textContent = '加载失败，请检查 softnami.glb 文件';
        });

        // ===== 控制器 =====
        const controls = new OrbitControls(camera, renderer.domElement);
        controls.enableDamping = true;
        controls.dampingFactor = 0.05;
        controls.minDistance = 3;
        controls.maxDistance = 12;
        controls.maxPolarAngle = Math.PI / 2 - 0.05;
        controls.target.set(0, 0.5, 0);

        window.resetCamera = () => {
            camera.position.set(0, 2.5, 6);
            controls.target.set(0, 0.5, 0);
            controls.update();
        };

        let autoRotate = false;
        window.toggleAutoRotate = () => {
            autoRotate = !autoRotate;
            controls.autoRotate = autoRotate;
        };

        // ===== 捏捏乐 =====
        let count = 0, combo = 0, lastSquishTime = 0, isSquishing = false;
        const raycaster = new THREE.Raycaster();
        const mouse = new THREE.Vector2();

        const moods = [
            { threshold: 0, text: '夏尔洗白白啦~' },
            { threshold: 5, text: '夏尔：囔' },
            { threshold: 15, text: '夏尔：囔--囔' },
            { threshold: 30, text: '夏尔：囔---呜！' },
            { threshold: 50, text: '夏尔：囔——囔——' },
            { threshold: 100, text: '夏尔：呜（囔囔哭）' }
        ];
        const soundTexts = ['噗', '咕', '呜', '囔', '噗叽', '软软糯糯', '奶绒绒', '软乎乎！'];

        function squish(clientX, clientY) {
            const now = Date.now();
            if (now - lastSquishTime < 1500) combo++; else combo = 1;
            lastSquishTime = now;
            count++;

            document.getElementById('count').textContent = count;
            document.getElementById('combo').textContent = combo;
            const mood = moods.slice().reverse().find(m => count >= m.threshold);
            document.getElementById('mood').textContent = mood.text + (combo > 3 ? ` (连击x${combo}!)` : '');

            if (!isSquishing) {
                isSquishing = true;
                const startScale = ponyGroup.scale.clone();
                const squishScale = new THREE.Vector3(1.15, 0.75, 1.15);
                const bounceScale = new THREE.Vector3(0.95, 1.05, 0.95);
                let phase = 0;
                const animateSquish = () => {
                    phase += 0.08;
                    if (phase < 1) {
                        ponyGroup.scale.lerpVectors(startScale, squishScale, Math.sin(phase * Math.PI));
                        requestAnimationFrame(animateSquish);
                    } else if (phase < 2) {
                        ponyGroup.scale.lerpVectors(squishScale, bounceScale, Math.sin((phase-1) * Math.PI));
                        requestAnimationFrame(animateSquish);
                    } else if (phase < 3) {
                        ponyGroup.scale.lerpVectors(bounceScale, startScale, Math.sin((phase-2) * Math.PI * 0.5));
                        requestAnimationFrame(animateSquish);
                    } else {
                        ponyGroup.scale.copy(startScale);
                        isSquishing = false;
                    }
                };
                animateSquish();
            }

            const text = document.createElement('div');
            text.className = 'pop-text';
            text.textContent = soundTexts[Math.floor(Math.random() * soundTexts.length)];
            text.style.left = clientX + 'px';
            text.style.top = (clientY - 40) + 'px';
            document.body.appendChild(text);
            setTimeout(() => text.remove(), 800);

            for (let i = 0; i < 8; i++) {
                const p = document.createElement('div');
                p.style.cssText = 'position:absolute;width:8px;height:8px;border-radius:50%;pointer-events:none;';
                p.style.background = ['#f4d03f','#e8a87c','#f5e6d3','#d4a5a5'][Math.floor(Math.random()*4)];
                p.style.left = clientX + 'px';
                p.style.top = clientY + 'px';
                const tx = (Math.random() - 0.5) * 120;
                const ty = -Math.random() * 100 - 20;
                p.animate([{ transform:'translate(0,0) scale(1)', opacity:1 }, { transform:`translate(${tx}px,${ty}px) scale(0)`, opacity:0 }], { duration:800, easing:'ease-out' });
                document.body.appendChild(p);
                setTimeout(() => p.remove(), 800);
            }
        }

        renderer.domElement.addEventListener('pointerdown', (e) => {
            mouse.x = (e.clientX / window.innerWidth) * 2 - 1;
            mouse.y = -(e.clientY / window.innerHeight) * 2 + 1;
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(ponyGroup.children, true);
            if (intersects.length > 0) squish(e.clientX, e.clientY);
        });

        window.addEventListener('keydown', (e) => {
            if (e.code === 'Space' || e.code === 'Enter') {
                e.preventDefault();
                const rect = renderer.domElement.getBoundingClientRect();
                squish(rect.left + rect.width/2, rect.top + rect.height/2);
            }
        });

        const clock = new THREE.Clock();
        function animate() {
            requestAnimationFrame(animate);
            const t = clock.getElapsedTime();
            if (!isSquishing) {
                ponyGroup.position.y = Math.sin(t * 1.5) * 0.03;
                ponyGroup.rotation.y = Math.sin(t * 0.4) * 0.08;
            }
            controls.update();
            renderer.render(scene, camera);
        }

        window.addEventListener('resize', () => {
            camera.aspect = window.innerWidth / window.innerHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(window.innerWidth, window.innerHeight);
        });

        animate();
    </script>
</body>
</html>
