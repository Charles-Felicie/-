<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>病房美学计划 · 戴上春天</title>
<link rel="stylesheet" href="assets/style.css">
<style>
  .landing-hero{
    position:relative;margin:0;padding:0;height:440px;overflow:hidden;cursor:default;
    background:#5B4232 url('登录页头图.png') center/cover no-repeat;
    transition:height .65s cubic-bezier(.34,1.56,.64,1);
  }
  .landing-hero.expanded{height:88vh;background-size:contain;background-position:center top}
  .landing-hero::before{
    content:'';position:absolute;inset:0;background:rgba(43,30,22,0);
    transition:background .5s;
  }
  .landing-hero:hover::before{background:rgba(43,30,22,.55)}
  .hero-content{
    position:absolute;left:48px;bottom:40px;max-width:720px;
    transition:left .55s ease,bottom .55s ease,transform .55s ease;
  }
  .landing-hero:hover .hero-content{
    left:50%;bottom:50%;transform:translate(-50%,50%);text-align:center;
  }
  .landing-hero h1{font-size:clamp(38px,5.4vw,60px);margin:0;color:#fff;
    text-shadow:0 2px 14px rgba(0,0,0,.45)}
  .landing-hero .hero-more{
    max-height:0;opacity:0;overflow:hidden;
    transition:max-height .5s ease .1s,opacity .5s ease .1s,margin-top .5s ease .1s;
  }
  .landing-hero:hover .hero-more{max-height:220px;opacity:1;margin-top:18px}
  .landing-hero .en{font-size:clamp(16px,1.9vw,22px);color:rgba(255,255,255,.92);letter-spacing:.1em}
  .landing-hero p.desc{max-width:680px;margin:14px auto 0;color:rgba(255,255,255,.85);font-size:15px}
  .portal-section{padding:64px 0}
  .portal-card{
    position:relative;overflow:hidden;
    background:#fff;border:1px solid var(--line);border-radius:16px;
    min-height:280px;padding:34px 28px;text-align:left;
    display:flex;flex-direction:column;align-items:flex-start;gap:14px;
    transition:box-shadow .18s,transform .18s;
  }
  .portal-card:hover{transform:translateY(-3px);box-shadow:0 14px 30px rgba(91,66,50,.15)}
  .portal-card h3{font-size:22px}
  .portal-card .pc-desc{
    max-height:0;opacity:0;overflow:hidden;margin:0;
    transition:max-height .35s,opacity .35s;
    font-size:13px;color:var(--ink-soft);max-width:60%;
  }
  .portal-card:hover .pc-desc{max-height:120px;opacity:1}
  .portal-card .pc-emoji{
    position:absolute;right:-4px;bottom:-14px;
    font-size:110px;line-height:1;width:33%;text-align:center;
    pointer-events:none;filter:drop-shadow(0 4px 8px rgba(91,66,50,.18));
  }
  .portal-card .pc-img{
    position:absolute;right:0;bottom:0;height:75%;width:auto;
    pointer-events:none;transition:opacity .3s;
  }
  .portal-card:hover .pc-img{opacity:.22}
  .portal-card .btn-pill{margin-top:auto}
  .admin-strip{padding:26px 0;text-align:center;font-size:14px}
  .admin-strip .btn{margin-left:14px}
  footer.site{padding:30px 0;text-align:center;color:var(--ink-soft);font-size:12px}
</style>
</head>
<body>

<header class="landing-hero">
  <div class="hero-content">
    <h1 class="f-brand" data-i18n="hero_title">病房美学计划 · 戴上春天</h1>
    <div class="hero-more">
      <div class="en" data-i18n="hero_en">Beauty Belongs to Every Bed</div>
      <p class="desc" data-i18n="hero_desc">让长期住院的女性和儿童，把本来就必须戴的头巾和口罩，变成自己创作的艺术品。美不是虚荣，是尊严。</p>
    </div>
  </div>
</header>

<section class="portal-section">
  <div class="container">
    <div class="grid grid-2">
      <button class="portal-card" onclick="location.href='charity.html'">
        <h3 data-i18n="entry_c">公益用户</h3>
        <p class="pc-desc" data-i18n="entry_c_desc">面向病房中的女性与儿童：作画疗愈、AI 试妆、接收爱心画作与公益产品。</p>
        <span class="btn btn-pill" data-i18n="entry_c_btn">进入公益端</span>
        <img class="pc-img" src="登录页4.jpg" alt="">
      </button>
      <button class="portal-card" onclick="location.href='user.html'">
        <h3 data-i18n="entry_n">普通用户</h3>
        <p class="pc-desc" data-i18n="entry_n_desc">健康用户创作数字画作、捐赠定制头巾口罩、AI 试妆体验与社区互动。</p>
        <span class="btn btn-pill" data-i18n="entry_n_btn">进入正常端</span>
        <img class="pc-img" src="登录页3.jpg" alt="">
      </button>
    </div>
  </div>
</section>

<div class="admin-strip">
  <div class="container" style="display:flex;align-items:center;justify-content:center;flex-wrap:wrap;gap:10px">
    <span class="muted" data-i18n="admin_staff">平台工作人员</span>
    <button class="btn btn-outline btn-sm" onclick="location.href='admin.html'" data-i18n="admin_entry">管理员入口</button>
    <select id="langSel" class="lang-sel" onchange="setLang(this.value)" aria-label="language">
      <option value="zh">简体中文</option>
      <option value="en">English</option>
      <option value="fr">Français</option>
    </select>
  </div>
</div>

<footer class="site">
  <div class="container" data-i18n="footer">病房美学计划 Ward Aesthetics Program · 公益演示系统（PC 版）</div>
</footer>

<script src="assets/common.js"></script>
<script>
const I18N = {
  zh:{
    hero_title:'病房美学计划 · 戴上春天',
    hero_en:'Beauty Belongs to Every Bed',
    hero_desc:'让长期住院的女性和儿童，把本来就必须戴的头巾和口罩，变成自己创作的艺术品。美不是虚荣，是尊严。',
    entry_c:'公益用户', entry_c_desc:'面向病房中的女性与儿童：作画疗愈、AI 试妆、接收爱心画作与公益产品。',
    entry_c_btn:'进入公益端',
    entry_n:'普通用户', entry_n_desc:'健康用户创作数字画作、捐赠定制头巾口罩、AI 试妆体验与社区互动。',
    entry_n_btn:'进入正常端',
    admin_staff:'平台工作人员', admin_entry:'管理员入口',
    footer:'病房美学计划 Ward Aesthetics Program · 公益演示系统（PC 版）',
    session_hint:'检测到登录记录：'
  },
  en:{
    hero_title:'Ward Aesthetics Program · Wear the Spring',
    hero_en:'Beauty Belongs to Every Bed',
    hero_desc:'Women and children in long-term hospital care turn the headscarves and masks they must wear into artworks of their own. Beauty is not vanity — it is dignity.',
    entry_c:'Charity User', entry_c_desc:'For women and children in hospital wards: healing painting, AI try-on, receiving donated artworks and charity products.',
    entry_c_btn:'Enter Charity Portal',
    entry_n:'General User', entry_n_desc:'Create digital artworks, donate custom scarves and masks, enjoy AI try-on and community interaction.',
    entry_n_btn:'Enter General Portal',
    admin_staff:'Platform staff', admin_entry:'Admin Entry',
    footer:'Ward Aesthetics Program · Charity Demo System (PC)',
    session_hint:'Existing session found: '
  },
  fr:{
    hero_title:"Programme d'esthétique hospitalière · Porter le printemps",
    hero_en:'Beauty Belongs to Every Bed',
    hero_desc:"Les femmes et les enfants hospitalisés longtemps transforment les foulards et masques qu'ils doivent porter en œuvres d'art. La beauté n'est pas une vanité, c'est une dignité.",
    entry_c:'Utilisateur caritatif', entry_c_desc:"Pour les femmes et les enfants en chambre d'hôpital : peinture thérapeutique, essai IA, œuvres et produits caritatifs.",
    entry_c_btn:'Entrer côté caritatif',
    entry_n:'Utilisateur général', entry_n_desc:"Créez des œuvres numériques, donnez des foulards et masques personnalisés, essayage IA et communauté.",
    entry_n_btn:'Entrer côté général',
    admin_staff:'Personnel de la plateforme', admin_entry:'Entrée administrateur',
    footer:"Programme d'esthétique hospitalière · Système de démonstration caritative (PC)",
    session_hint:'Session existante détectée : '
  }
};
let lang = Store.get('lang','zh');
const t = k => (I18N[lang] && I18N[lang][k] != null) ? I18N[lang][k] : (I18N.zh[k] != null ? I18N.zh[k] : k);
function applyI18n(){
  document.documentElement.lang = lang === 'zh' ? 'zh-CN' : lang;
  document.querySelectorAll('[data-i18n]').forEach(el => el.textContent = t(el.dataset.i18n));
  const sel = document.getElementById('langSel');
  if(sel) sel.value = lang;
}
function setLang(l){ lang = l; Store.set('lang', l); applyI18n(); }
applyI18n();

/* Elastic hero: pull down (wheel up at page top) to reveal the full image */
(function(){
  const hero = document.querySelector('.landing-hero');
  window.addEventListener('wheel', e => {
    if(window.scrollY > 0) return;
    if(e.deltaY < 0 && !hero.classList.contains('expanded')){
      hero.classList.add('expanded');
    }else if(e.deltaY > 0 && hero.classList.contains('expanded')){
      hero.classList.remove('expanded');
    }
  }, {passive:true});
})();

/* If a session already exists, show a quick re-entry hint */
const s = getSession();
if(s){
  toast(t('session_hint') + s.name);
}
</script>
</body>
</html>
